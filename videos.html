const subject = params.get("subject");

const selectedSubject = videoData[subject];

const titleElement = document.getElementById("subjectTitle");
const descriptionElement = document.getElementById("subjectDescription");
const videoList = document.getElementById("videoList");

if (selectedSubject) {

    titleElement.textContent = selectedSubject.name;
    descriptionElement.textContent =
        selectedSubject.description + " | ทั้งหมด " +
        selectedSubject.videos.length + " รายการ";

    selectedSubject.videos.forEach((video, index) => {

        let icon = "▶️";
        let typeText = "วิดีโอ YouTube";

        if (video.type === "playlist") {
            icon = "📂";
            typeText = "เพลย์ลิสต์ YouTube";
        }

        if (video.type === "channel") {
            icon = "📺";
            typeText = "ช่อง YouTube";
        }

        if (video.type === "video") {
            icon = "🎬";
            typeText = "วิดีโอ YouTube";
        }

        const card = document.createElement("div");
        card.className = "video-item";

        const iconElement = document.createElement("div");
        iconElement.className = "video-icon";
        iconElement.textContent = icon;

        const heading = document.createElement("h3");
        heading.textContent = video.title;

        const description = document.createElement("p");
        description.textContent = typeText;

        const link = document.createElement("a");
        link.className = "watch-btn";
        link.href = video.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "▶ เปิดดูบน YouTube →";

        card.appendChild(iconElement);
        card.appendChild(heading);
        card.appendChild(description);
        card.appendChild(link);
