
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>วิดีโอการเรียนรู้ | คลังข้อสอบ</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Prompt',sans-serif;background:#f8f7fc;color:#29253d}
nav{padding:18px 8%;background:white;display:flex;justify-content:space-between;align-items:center;box-shadow:0 3px 20px #ddd;position:sticky;top:0}
.logo{font-size:25px;font-weight:800;color:#6035a5}
.logo span{color:#36a66b}
.nav-back{color:#6035a5;text-decoration:none;font-weight:600;font-size:14px}
.hero{text-align:center;padding:60px 20px;background:linear-gradient(120deg,#e1f6e9,#eee5ff)}
.hero .icon{font-size:55px}
.hero h1{font-size:35px;color:#58349b}
.hero p{color:#716b80;margin-top:10px}
section{padding:55px 8%}
.section-title{text-align:center;color:#6038a0;margin-bottom:35px}
.video-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:25px}
.video-card{background:white;padding:18px;border-radius:20px;box-shadow:0 7px 25px #e2ddeb}
.video-frame{width:100%;aspect-ratio:16/9;background:linear-gradient(120deg,#e1f6e9,#eee5ff);border-radius:13px;overflow:hidden;display:flex;align-items:center;justify-content:center}
.video-frame iframe{width:100%;height:100%;border:0}
.placeholder{text-align:center;color:#6841b0}
.placeholder div{font-size:48px}
.video-card h3{color:#593c91;margin-top:15px;font-size:17px}
.video-card p{color:#888;font-size:13px;margin-top:6px;line-height:1.7}
.buttons{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:40px}
.btn{padding:12px 25px;border-radius:30px;text-decoration:none;color:white;background:linear-gradient(110deg,#39ad70,#6841b0);font-size:14px}
footer{background:linear-gradient(110deg,#286e50,#56328c);color:white;text-align:center;padding:30px}
@media(max-width:650px){.video-grid{grid-template-columns:1fr}nav{padding:15px 5%}.hero h1{font-size:28px}section{padding:40px 6%}}
</style>
</head>

<body>

<nav>
    <div class="logo">คลัง<span>ข้อสอบ.</span></div>
    <a href="video.html" class="nav-back">← กลับไปเลือกวิชา</a>
</nav>

<header class="hero">
    <div class="icon" id="subjectIcon">📚</div>
    <h1 id="subjectName">วิดีโอการเรียนรู้</h1>
    <p id="subjectDescription">รับชมวิดีโอและทบทวนบทเรียน</p>
</header>

<section>
    <h2 class="section-title">คลังวิดีโอการสอน</h2>

    <div class="video-grid" id="videoList"></div>

    <div class="buttons">
        <a href="video.html" class="btn">← กลับไปเลือกวิชา</a>
        <a href="index.html" class="btn">กลับหน้าหลัก</a>
    </div>
</section>

<footer>
    <h3>📚 คลังข้อสอบ</h3>
    <p>© 2026 Online Examination System</p>
</footer>

<script>
const subjects = {
    math: {
        name: "วิชาคณิตศาสตร์",
        icon: "➗",
        description: "เรียนรู้และฝึกฝนทักษะทางคณิตศาสตร์",
        videos: [
            {title:"วิดีโอสอนคณิตศาสตร์ 1",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""},
            {title:"วิดีโอสอนคณิตศาสตร์ 2",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""}
        ]
    },
    science: {
        name: "วิชาวิทยาศาสตร์",
        icon: "🔬",
        description: "เรียนรู้หลักการและกระบวนการทางวิทยาศาสตร์",
        videos: [
            {title:"วิดีโอสอนวิทยาศาสตร์ 1",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""},
            {title:"วิดีโอสอนวิทยาศาสตร์ 2",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""}
        ]
    },
    thai: {
        name: "วิชาภาษาไทย",
        icon: "📚",
        description: "พัฒนาทักษะการอ่าน การเขียน และหลักภาษาไทย",
        videos: [
            {title:"วิดีโอสอนภาษาไทย 1",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""},
            {title:"วิดีโอสอนภาษาไทย 2",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""}
        ]
    },
    english: {
        name: "วิชาภาษาอังกฤษ",
        icon: "🌎",
        description: "ฝึกฝนทักษะภาษาอังกฤษ",
        videos: [
            {title:"วิดีโอสอนภาษาอังกฤษ 1",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""},
            {title:"วิดีโอสอนภาษาอังกฤษ 2",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""}
        ]
    },
    computer: {
        name: "วิชาคอมพิวเตอร์",
        icon: "💻",
        description: "เรียนรู้เทคโนโลยีและทักษะดิจิทัล",
        videos: [
            {title:"วิดีโอสอนคอมพิวเตอร์ 1",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""},
            {title:"วิดีโอสอนคอมพิวเตอร์ 2",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""}
        ]
    },
    social: {
        name: "วิชาสังคมศึกษา",
        icon: "🌍",
        description: "เรียนรู้สังคม ประวัติศาสตร์ และหน้าที่พลเมือง",
        videos: [
            {title:"วิดีโอสอนสังคมศึกษา 1",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""},
            {title:"วิดีโอสอนสังคมศึกษา 2",description:"เพิ่มเนื้อหาบทเรียนได้ที่นี่",url:""}
        ]
    }
};

const params = new URLSearchParams(window.location.search);
const subjectKey = params.get("subject");
const subject = subjects[subjectKey];

if (!subject) {
    document.getElementById("subjectName").textContent = "ไม่พบรายวิชา";
    document.getElementById("subjectDescription").textContent = "กรุณากลับไปเลือกวิชาอีกครั้ง";
    document.getElementById("videoList").innerHTML =
        '<p>ไม่พบข้อมูลรายวิชา</p>';
} else {
    document.title = subject.name + " | คลังข้อสอบ";
    document.getElementById("subjectIcon").textContent = subject.icon;
    document.getElementById("subjectName").textContent = subject.name;
    document.getElementById("subjectDescription").textContent = subject.description;

    const videoList = document.getElementById("videoList");

    subject.videos.forEach((video, index) => {
        let videoContent;

        if (video.url.trim() !== "") {
            let videoId = video.url.match(
                /(?:youtube\.com\/(?:watch\?v=|embed\/)|youtu\.be\/)([^&?\/]+)/
            );

            let embedUrl = videoId
                ? "https://www.youtube.com/embed/" + videoId[1]
                : video.url;

            videoContent = `
                <iframe src="${embedUrl}"
                    title="${video.title}"
                    allowfullscreen>
                </iframe>`;
        } else {
            videoContent = `
                <div class="placeholder">
                    <div>🎬</div>
                    <p>รอเพิ่มวิดีโอการเรียนรู้</p>
                </div>`;
        }

        videoList.innerHTML += `
            <div class="video-card">
                <div class="video-frame">
                    ${videoContent}
                </div>
                <h3>${video.title}</h3>
                <p>${video.description}</p>
            </div>`;
    });
}
</script>

</body>
</html>
